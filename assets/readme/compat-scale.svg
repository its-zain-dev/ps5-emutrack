<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 142" width="880" height="142" role="img" aria-labelledby="compat-title compat-desc">
  <title id="compat-title">5-Tier Game Compatibility Scale</title>
  <desc id="compat-desc">Status scale from Nothing, Boots, Menus, In-Game to Playable, plus Verified vs Unverified badge rules.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes beacon {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .b1 { animation: beacon 2.5s ease-in-out 0s infinite; }
      .b2 { animation: beacon 2.5s ease-in-out 0.5s infinite; }
      .b3 { animation: beacon 2.5s ease-in-out 1.0s infinite; }
      .b4 { animation: beacon 2.5s ease-in-out 1.5s infinite; }
      .b5 { animation: beacon 2.5s ease-in-out 2.0s infinite; }
    </style>
  </defs>

  <rect x="1" y="1" width="878" height="140" rx="16" fill="#0b101b" stroke="#94a3b8" stroke-opacity="0.22" stroke-width="1.2"/>
  <text x="26" y="27" class="mono" font-size="11" font-weight="600" fill="#6aa8ff" letter-spacing="0.8">COMPATIBILITY SCALE · WORST TO BEST</text>

  <!-- 5 Status Cards -->
  <g transform="translate(26, 40)">
    <!-- Nothing -->
    <rect x="0" y="0" width="156" height="52" rx="10" fill="#1a131a" stroke="#ef4444" stroke-opacity="0.45"/>
    <circle class="b1" cx="18" cy="20" r="5" fill="#ef4444"/>
    <text x="30" y="24" class="sans" font-size="13.5" font-weight="700" fill="#fca5a5">Nothing</text>
    <text x="14" y="41" class="sans" font-size="11" fill="#94a3b8">Crashes or won't start</text>

    <!-- Boots -->
    <rect x="168" y="0" width="156" height="52" rx="10" fill="#1b1613" stroke="#f97316" stroke-opacity="0.45"/>
    <circle class="b2" cx="186" cy="20" r="5" fill="#f97316"/>
    <text x="198" y="24" class="sans" font-size="13.5" font-weight="700" fill="#fdba74">Boots</text>
    <text x="182" y="41" class="sans" font-size="11" fill="#94a3b8">Logo or loading screen</text>

    <!-- Menus -->
    <rect x="336" y="0" width="156" height="52" rx="10" fill="#1a1913" stroke="#eab308" stroke-opacity="0.45"/>
    <circle class="b3" cx="354" cy="20" r="5" fill="#eab308"/>
    <text x="366" y="24" class="sans" font-size="13.5" font-weight="700" fill="#fde047">Menus</text>
    <text x="350" y="41" class="sans" font-size="11" fill="#94a3b8">Title UI, no gameplay</text>

    <!-- In-Game -->
    <rect x="504" y="0" width="156" height="52" rx="10" fill="#111a2b" stroke="#3b82f6" stroke-opacity="0.5"/>
    <circle class="b4" cx="522" cy="20" r="5" fill="#3b82f6"/>
    <text x="534" y="24" class="sans" font-size="13.5" font-weight="700" fill="#93c5fd">In-Game</text>
    <text x="518" y="41" class="sans" font-size="11" fill="#94a3b8">Enters gameplay w/ bugs</text>

    <!-- Playable -->
    <rect x="672" y="0" width="156" height="52" rx="10" fill="#101f19" stroke="#22c55e" stroke-opacity="0.5"/>
    <circle class="b5" cx="690" cy="20" r="5" fill="#22c55e"/>
    <text x="702" y="24" class="sans" font-size="13.5" font-weight="700" fill="#86efac">Playable</text>
    <text x="686" y="41" class="sans" font-size="11" fill="#94a3b8">Completable smoothly</text>
  </g>

  <!-- Verification comparison footer -->
  <rect x="26" y="102" width="406" height="26" rx="7" fill="#101f19" stroke="#22c55e" stroke-opacity="0.4"/>
  <circle cx="41" cy="115" r="4" fill="#22c55e"/>
  <text x="53" y="119" class="sans" font-size="11.5" fill="#cbd5e1">
    <tspan font-weight="700" fill="#86efac">Verified:</tspan> Maintainer-reviewed + https:// evidence link
  </text>

  <rect x="448" y="102" width="406" height="26" rx="7" fill="#131926" stroke="#94a3b8" stroke-opacity="0.45" stroke-dasharray="4 3"/>
  <text x="462" y="119" class="mono" font-size="11.5" font-weight="700" fill="#cbd5e1">?</text>
  <text x="476" y="119" class="sans" font-size="11.5" fill="#94a3b8">
    <tspan font-weight="700" fill="#cbd5e1">Unverified:</tspan> Legacy entry without source (treat as rumour)
  </text>
</svg>
