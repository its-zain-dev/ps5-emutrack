<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">PS5 EmuTrack — Open-Source PlayStation 5 Emulator &amp; Compatibility Hub</title>
  <desc id="hero-desc">Animated header banner showing PS5 EmuTrack telemetry radar, project overview, and architecture highlights.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#131830"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="15%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#3d8bff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3d8bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="90%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6aa8ff"/>
      <stop offset="50%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="scan-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d8bff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6aa8ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="card-clip">
      <rect x="1" y="1" width="878" height="248" rx="18"/>
    </clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.82); }
      }
      @keyframes radarPulse {
        0% { r: 30px; opacity: 0.7; stroke-width: 2px; }
        100% { r: 74px; opacity: 0; stroke-width: 0.5px; }
      }
      @keyframes scanX {
        0% { transform: translateX(-220px); }
        100% { transform: translateX(920px); }
      }
      @keyframes orbitSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes orbitSpinRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes cardFloat {
        0%, 100% { stroke-opacity: 0.18; }
        50% { stroke-opacity: 0.48; }
      }
      .pulse-dot { transform-origin: 214px 36px; animation: pulseDot 2.2s ease-in-out infinite; }
      .radar-1 { animation: radarPulse 3.2s cubic-bezier(0.2, 0.7, 0.3, 1) infinite; }
      .radar-2 { animation: radarPulse 3.2s cubic-bezier(0.2, 0.7, 0.3, 1) 1.6s infinite; }
      .scan { animation: scanX 4.5s ease-in-out infinite; }
      .spin-cw { transform-origin: 102px 110px; animation: orbitSpin 28s linear infinite; }
      .spin-ccw { transform-origin: 102px 110px; animation: orbitSpinRev 18s linear infinite; }
      .stat-1 { animation: cardFloat 4s ease-in-out 0s infinite; }
      .stat-2 { animation: cardFloat 4s ease-in-out 1s infinite; }
      .stat-3 { animation: cardFloat 4s ease-in-out 2s infinite; }
      .stat-4 { animation: cardFloat 4s ease-in-out 3s infinite; }
    </style>
  </defs>

  <g clip-path="url(#card-clip)">
    <rect width="880" height="250" fill="url(#bg-grad)"/>
    <rect width="880" height="250" fill="url(#grid)"/>
    <rect width="880" height="250" fill="url(#glow-blue)"/>
    <rect width="880" height="250" fill="url(#glow-purple)"/>

    <!-- Top scanning shimmer beam -->
    <rect class="scan" x="0" y="1" width="220" height="2.5" fill="url(#scan-beam)"/>

    <!-- Left animated telemetry emblem -->
    <circle class="radar-1" cx="102" cy="110" r="32" fill="none" stroke="#3d8bff"/>
    <circle class="radar-2" cx="102" cy="110" r="32" fill="none" stroke="#8b5cf6"/>

    <g class="spin-cw">
      <circle cx="102" cy="110" r="64" fill="none" stroke="#3d8bff" stroke-opacity="0.32" stroke-width="1.5" stroke-dasharray="6 7"/>
      <circle cx="166" cy="110" r="3.5" fill="#6aa8ff"/>
    </g>
    <g class="spin-ccw">
      <circle cx="102" cy="110" r="49" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.25" stroke-dasharray="3 6"/>
      <circle cx="53" cy="110" r="2.8" fill="#c4b5fd"/>
    </g>

    <!-- Core PS5-inspired chip emblem -->
    <rect x="70" y="78" width="64" height="64" rx="16" fill="#0d1524" stroke="#3d8bff" stroke-opacity="0.6" stroke-width="1.6"/>
    <path d="M87 95h15.5a9.2 9.2 0 0 1 0 18.4H94.5v9.6H87V95Z" fill="#3d8bff"/>
    <path d="M94.5 101v6.4h7.5a3.2 3.2 0 0 0 0-6.4h-7.5Z" fill="#0d1524"/>
    <circle cx="117" cy="98.5" r="3.6" fill="#6aa8ff"/>
    <path d="M110 118.5c4.8 0 9-2.4 11.4-6.4" fill="none" stroke="#6aa8ff" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M108 124.2c7.2 0 13.5-3.8 17-9.6" fill="none" stroke="#a78bfa" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>

    <!-- Live telemetry pill -->
    <rect x="198" y="23" width="272" height="26" rx="13" fill="#131c2e" stroke="#3d8bff" stroke-opacity="0.35"/>
    <circle class="pulse-dot" cx="214" cy="36" r="4" fill="#22c55e"/>
    <text x="226" y="40" class="mono" font-size="11" font-weight="600" fill="#cbd5e1" letter-spacing="0.6">HOURLY GITHUB SYNC · LIVE HUB</text>

    <!-- Main title & tagline -->
    <text x="198" y="96" class="sans" font-size="42" font-weight="800" letter-spacing="-0.8">
      <tspan fill="#f1f5f9">PS5 </tspan><tspan fill="url(#title-grad)">EmuTrack</tspan>
    </text>
    <text x="198" y="128" class="sans" font-size="16" fill="#b4bfcf">
      Every open-source PlayStation 5 emulator, release &amp; sourced compatibility report.
    </text>
    <text x="198" y="150" class="sans" font-size="13" fill="#8592a6">
      No piracy, no binaries hosted, no unverified guesswork — powered by GitHub Actions.
    </text>

    <!-- 4 telemetry stat boxes -->
    <g transform="translate(198, 174)">
      <rect class="stat-1" x="0" y="0" width="154" height="54" rx="11" fill="#111a2b" stroke="#6aa8ff" stroke-width="1"/>
      <text x="14" y="23" class="sans" font-size="18" font-weight="800" fill="#f8fafc">50+ Repos</text>
      <text x="14" y="41" class="mono" font-size="10.5" fill="#8592a6">PS5 · Forks · Ports</text>

      <rect class="stat-2" x="166" y="0" width="154" height="54" rx="11" fill="#111a2b" stroke="#22c55e" stroke-width="1"/>
      <text x="180" y="23" class="sans" font-size="18" font-weight="800" fill="#f8fafc">60m Sync</text>
      <text x="180" y="41" class="mono" font-size="10.5" fill="#8592a6">GitHub API + Cache</text>

      <rect class="stat-3" x="332" y="0" width="154" height="54" rx="11" fill="#111a2b" stroke="#a78bfa" stroke-width="1"/>
      <text x="346" y="23" class="sans" font-size="18" font-weight="800" fill="#f8fafc">5-Tier Scale</text>
      <text x="346" y="41" class="mono" font-size="10.5" fill="#8592a6">Evidence Verified</text>

      <rect class="stat-4" x="498" y="0" width="154" height="54" rx="11" fill="#111a2b" stroke="#f5b301" stroke-width="1"/>
      <text x="512" y="23" class="sans" font-size="18" font-weight="800" fill="#f8fafc">Zero Build</text>
      <text x="512" y="41" class="mono" font-size="10.5" fill="#8592a6">Stdlib + Static UI</text>
    </g>
  </g>
  <rect x="1" y="1" width="878" height="248" rx="18" fill="none" stroke="#3d8bff" stroke-opacity="0.32" stroke-width="1.5"/>
</svg>
