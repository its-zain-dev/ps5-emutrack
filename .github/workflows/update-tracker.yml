name: Hourly PS5 EmuTrack Release Sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest PS5 emulator releases & scan game compatibility
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_tracker.py

      - name: Commit updated data.json snapshots if changed
        run: |
          git config user.name "ps5-emutrack-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data.json gh-pages/data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): sync PS5 emulator releases & game compatibility"
            git push
          else
            echo "No release or compatibility changes detected."
          fi
