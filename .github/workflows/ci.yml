name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data files
        run: python -m tracker validate
      - name: Check README matches data/emulators.json
        run: python -m tracker readme --check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
