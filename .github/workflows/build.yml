name: Build & Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Angular build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JSON/config assets
        run: |
          node -e "['package.json','metadata.json','angular.json','public/data.json','gh-pages/data.json','data/submissions.json'].forEach(f=>{JSON.parse(require('fs').readFileSync(f,'utf8'));console.log('OK',f)})"

      - name: Build (Angular SSR + browser)
        run: npx ng build

      - name: Report build output
        run: |
          echo "### Build output" >> $GITHUB_STEP_SUMMARY
          find dist -maxdepth 3 -type d | head -20 >> $GITHUB_STEP_SUMMARY
          du -sh dist >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7
