name: Submit an Emulator
description: Propose an open-source PS5 emulator, fork, or port to add to PS5 EmuTrack.
title: "[Emulator] "
labels: ["emulator-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Only public, open-source repositories on GitHub are accepted. Automated checks run as soon as you open this issue.
  - type: input
    id: name
    attributes:
      label: Emulator name
      placeholder: e.g. NovaPS5
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repository
      description: Full GitHub repository URL.
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - PS5 emulator / compatibility layer
        - Fork or custom build of another emulator
        - Port or frontend (Android, iOS, macOS, web, PS4…)
        - PS4 emulator / related project
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Short description
      description: 10–280 characters describing what it targets and how it works.
      placeholder: e.g. Experimental C++20 PS5 HLE runtime with a Vulkan renderer for Linux and Windows.
    validations:
      required: true
  - type: input
    id: fork_of
    attributes:
      label: Fork of (optional)
      description: If this is a fork or port of another tracked emulator, enter its name or repo URL.
      placeholder: e.g. KytyPS5
    validations:
      required: false
  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms
      options:
        - label: Windows
        - label: Linux
        - label: macOS
        - label: Android
        - label: iOS
        - label: PS4
        - label: Web
