<div class="min-h-screen flex flex-col bg-[#070B12] text-slate-100">
  <!-- Strict 3-Zone Top Bar Contract -->
  <header class="sticky top-0 z-30 border-b border-slate-800/80 bg-[#070B12]/90 backdrop-blur-md">
    <div class="mx-auto max-w-[1200px] px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-8">
      <!-- Zone 1: Single-element brand wordmark -->
      <a
        href="#compatibility"
        class="font-display text-lg font-bold tracking-tight text-white whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-cyan-400 rounded-sm"
      >
        PS5 EmuTrack
      </a>

      <!-- Zone 2: 4 concise single-line nav links -->
      <nav
        aria-label="Primary navigation"
        class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-300"
      >
        <a
          href="#compatibility"
          class="hover:text-white hover:underline underline-offset-4 transition-colors whitespace-nowrap shrink-0"
        >
          Compatibility
        </a>
        <a
          href="#emulators"
          class="hover:text-white hover:underline underline-offset-4 transition-colors whitespace-nowrap shrink-0"
        >
          Emulators
        </a>
        <a
          href="#automation"
          class="hover:text-white hover:underline underline-offset-4 transition-colors whitespace-nowrap shrink-0"
        >
          Automation
        </a>
        <a
          href="#faq"
          class="hover:text-white hover:underline underline-offset-4 transition-colors whitespace-nowrap shrink-0"
        >
          FAQ
        </a>
      </nav>

      <!-- Zone 3: 1 primary CTA -->
      <div class="flex items-center shrink-0">
        <a
          [href]="repoConfig.repoUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-1.5 rounded-lg bg-[#0070D1] hover:bg-[#0080EE] px-4 py-2 text-xs font-semibold text-white transition-colors whitespace-nowrap shrink-0 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cyan-400"
        >
          <mat-icon class="!text-[16px] !h-[16px] !w-[16px]" aria-hidden="true">star_outline</mat-icon>
          <span>View on GitHub</span>
        </a>
      </div>
    </div>
  </header>

  <main class="flex-1">
    <app-compatibility-matrix />
    <app-emulator-directory />
    <app-automation-and-faq />
  </main>

  <footer class="border-t border-slate-800/80 bg-[#0A101A] py-8">
    <div class="mx-auto max-w-[1200px] px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 text-xs text-slate-400">
      <div>
        <span class="font-semibold text-slate-200">PS5 EmuTrack</span>
        <span aria-hidden="true"> · </span>
        <span>Independent open-source PlayStation 5 emulator release &amp; compatibility index. No binaries hosted.</span>
      </div>

      <div class="flex flex-wrap items-center gap-5 shrink-0">
        <a
          href="/api/project-archive"
          download="ps5-emutrack-full-project.zip"
          class="inline-flex items-center gap-1 text-cyan-300 hover:text-white transition-colors whitespace-nowrap"
        >
          <mat-icon class="!text-[14px] !h-[14px] !w-[14px]" aria-hidden="true">folder_zip</mat-icon>
          <span>Download Project (.zip)</span>
        </a>
        <a
          [href]="repoConfig.submitIssueUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="hover:text-white transition-colors whitespace-nowrap"
        >
          Contribute via GitHub
        </a>
        <a
          [href]="repoConfig.repoUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="hover:text-white transition-colors whitespace-nowrap"
        >
          GitHub Repository
        </a>
        <a
          [href]="repoConfig.issuesReportUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="hover:text-white transition-colors whitespace-nowrap"
        >
          Report Compatibility
        </a>
        <a
          href="/data.json"
          target="_blank"
          rel="noopener noreferrer"
          class="hover:text-white transition-colors whitespace-nowrap"
        >
          data.json
        </a>
      </div>
    </div>
  </footer>
</div>
